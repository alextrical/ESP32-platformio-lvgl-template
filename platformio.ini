; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = "LVGL Display Template"
description = "Multi-board: ESP32"
default_envs = ESP32-CYD

[env]
platform = espressif32@7.0.0
framework = arduino
monitor_speed = 115200
build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps = 
	lvgl/lvgl@9.5.0
	lovyan03/LovyanGFX@1.2.21
	; adafruit/Adafruit PN532@1.3.4
	; adafruit/Adafruit NAU7802 Library@1.0.8
	; lvgl/lvgl@8.3.11
	; bblanchon/ArduinoJson@7.2.2

[env:ESP32-CYD]
extends = env
board = esp32dev
build_flags = 
	${env.build_flags}

[env:WT32-SC01_Plus]
extends = env
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
; board_upload.maximum_size = 16777216
board_build.partitions = src/partitions.csv
; board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = octal
build_flags = 
	-DBOARD_HAS_PSRAM
	${env.build_flags}